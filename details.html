<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSpectra — Описание</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-wrapper">
    <div class="phone-screen details-screen">
      <div class="hero-poster">
        <a href="catalog.html" class="back-btn">←</a>
        <img src="animefon.png" alt="Poster">
      </div>

      <div class="details-content">
        <h1 class="movie-title">ANIME</h1>
        <p class="movie-subtitle">Anime catalog</p>

        <div class="cast-grid">
          <div class="cast-card">
            <img src="jojo.png" >
            <span>JoJo</span>
          </div>
          <div class="cast-card">
            <img src="naruto.png">
            <span>Naruto</span>
          </div>
          <div class="cast-card">
            <img src="hanter x hanter.png" >
            <span>Hanter x Hanter</span>
          </div>
          <div class="cast-card">
            <img src="attack ON titan.png">
            <span>Atack on Titan</span>
          </div>
        </div>

       
        <div class="info-block">
          <h3>You might also like these anime</h3>
          <div class="similar-grid">
            <a href="details.html"><img src="ne piece.png" alt="One piece"></a>
            <a href="details.html"><img src="hodiachiy.png" alt="Howl's Moving Castle"></a>
            <a href="details.html"><img src="pokemon.png" alt="Pokemon"></a>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
